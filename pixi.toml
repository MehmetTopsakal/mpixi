[workspace]
authors = ["Mehmet Topsakal"]
channels = ["conda-forge"]
name = "default"
platforms = ["linux-64"]
version = "2026.09"

#[activation.env]
#PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/python3.14/site-packages/numpy/_core/lib/pkgconfig:$PKG_CONFIG_PATH"

[tasks]
gsasii = { cmd = "python -m GSASII", env = { GSASII_NOPATHHACKING = "true" } }

[dependencies]
python = ">=3.14,<3.15"
h5py = ">=3.12.1,<4"
imageio = ">=2.36.1,<3"
matplotlib-base = ">=3.10.0,<4"
meson-python = ">=0.17.1,<0.18"
ninja = ">=1.12.1,<2"
numpy = ">=2.2.1,<3"
pillow = ">=11.1.0,<12"
pkg-config = ">=0.29.2,<0.30"
pyopengl = ">=3.1.6,<4"
pyproject-metadata = ">=0.9.0,<0.10"
requests = ">=2.32.3,<3"
scipy = ">=1.15.0,<2"
tomli = ">=2.2.1,<3"
wheel = ">=0.45.1,<0.46"
wxpython = ">=4.2.2,<5"
pip = ">=24.3.1,<25"
python-build = ">=1.2.2.post1,<2"
zarr = ">=2.18.3,<4"
xmltodict = ">=0.14.2,<0.15"
pycifrw = ">=4.4.0"
pytest = ">=8.3.4,<9"
gitpython = ">=3.1.44,<4"
ipython = ">=8.32.0,<9"
cython = ">=3.0.11,<4"
seekpath = ">=2.1.0,<3"
pybaselines = ">=1.2.0,<2"
tomopy = ">=1.15.3,<2"
algotom = ">=1.7.0,<2"
numba = ">=0.67.0,<0.68"
cudatoolkit = ">=11.8.0,<12"
jupyterlab = ">=4.6.3,<5"
jupyterlab-h5web = ">=12.8.0,<13"
twine = ">=7.0.0,<8"

[pypi-options]
no-build-isolation = ["gsas-ii"]

[pypi-dependencies]
pyfai = "==2026.5.0"
fabio = "==2026.6.0"
xarray = "==2026.7.0"
pymatgen = ">=2026.5.4, <2027"
mp-api = ">=0.46.5, <0.47"
ipympl = ">=0.10.0, <0.11"
ipywidgets = ">=8.1.9, <9"
h5netcdf = ">=1.8.1, <2"
tqdm = ">=4.70.0, <5"
ipykernel = ">=7.3.0, <8"
xraydb = ">=4.5.8, <5"
papermill = ">=2.7.0, <3"

gsas-ii = { path = "./GSAS-II" } # Do git clone https://github.com/AdvancedPhotonSource/GSAS-II.git first
easyxrd = { git = "https://github.com/MehmetTopsakal/easyXRD.git",  extras = ["notebook"] }
