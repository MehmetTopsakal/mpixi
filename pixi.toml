[workspace]
channels = ["conda-forge"]
name = "main"
platforms = ["linux-64"]
version = "2026.09"

[tasks]

[activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/python3.14/site-packages/numpy/_core/lib/pkgconfig:$PKG_CONFIG_PATH"

[dependencies]
python = "3.14.*"
numpy = ">=2"
tomopy = ">=1.15.3,<2"
algotom = ">=1.7.0,<2"
numba = ">=0.67.0,<0.68"
pip = ">=26.2.1,<27"
conda = ">=26.7.1,<27"
cudatoolkit = ">=11.8.0,<12"
jupyterlab = ">=4.6.3,<5"
jupyterlab-h5web = ">=12.8.0,<13"
rioxarray = ">=0.23.0,<0.24"
rasterio = ">=1.5.1,<2"

[pypi-dependencies]
pyfai = "==2026.5.0"
fabio = "==2026.6.0"
xarray = "==2026.7.0"
pymatgen = ">=2026.5.4, <2027"
mp-api = ">=0.46.5, <0.47"
pybaselines = ">=1.2.1, <2"
ipympl = ">=0.10.0, <0.11"
ipywidgets = ">=8.1.9, <9"
h5netcdf = ">=1.8.1, <2"
tqdm = ">=4.70.0, <5"
ipykernel = ">=7.3.0, <8"
xraydb = ">=4.5.8, <5"
papermill = ">=2.7.0, <3"
#easyxrd = ">=0.1.6, <0.2"
pyopencl = ">=2026.1.4, <2027"
GSAS-II = { git = "https://github.com/AdvancedPhotonSource/GSAS-II.git",  extras = ["useful"] }
easyxrd = { git = "https://github.com/MehmetTopsakal/easyXRD.git",  extras = ["notebook"] }
